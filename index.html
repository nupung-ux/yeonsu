<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>연수 등록부</title>
<style>
  :root{
    --ink:#1c2733; --sub:#5d6978; --line:#d7dde6; --bg:#f3f5f8; --card:#ffffff;
    --accent:#1d5fbf; --accent-dark:#174c99; --ok:#17794d; --ok-bg:#e4f4ea; --warn:#b3261e;
    --on:#6b3fb5; --on-bg:#efe9fb; --off:#b3560b; --off-bg:#fdefdf;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:1640px;margin:0 auto;padding:20px 24px 24px}
  @media (max-width:700px){main{padding:16px 12px 20px}}
  h1{margin:0;font-size:1.45rem;line-height:1.3;text-wrap:balance}
  h2{margin:0 0 12px;font-size:1.08rem}
  a{color:var(--accent)}
  [hidden]{display:none!important}
  .muted{color:var(--sub)} .small{font-size:.88rem}
  .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:-20px -24px 14px;padding:12px 24px;
    position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  @media (max-width:700px){.top{margin:-16px -12px 12px;padding:10px 12px}}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  button,.btn{font:inherit;font-size:.93rem;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-block}
  button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible,a:focus-visible{outline:3px solid #c9dcf7;outline-offset:1px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-dark)}
  button.big{font-size:1.02rem;padding:11px 20px}
  button.danger{color:var(--warn)}
  button:disabled{opacity:.5;cursor:default}
  input[type=text],input[type=date],input[type=search],textarea,select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:inherit;width:100%}
  label.f{display:block;font-weight:700;font-size:.9rem}
  label.f>input,label.f>select{margin-top:4px;font-weight:400}
  .chk{display:inline-flex;gap:6px;align-items:center;font-size:.95rem;cursor:pointer;white-space:nowrap}
  .chk input{width:17px;height:17px;margin:0}
  .notice{background:#fff7e0;border:1px solid #ecd58b;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.93rem}
  .empty{text-align:center;color:var(--sub);padding:30px 12px}
  .badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:#e9edf2;color:var(--sub);white-space:nowrap}
  .badge.on{background:var(--on-bg);color:var(--on)} .badge.off{background:var(--off-bg);color:var(--off)}
  .badge.sign{background:#e6eefb;color:var(--accent-dark)} .badge.ok{background:var(--ok-bg);color:var(--ok)}

  /* 첫 화면 */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  .col h2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .col h2 small{font-weight:500;color:var(--sub);font-size:.85rem}
  .list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
  a.item:hover{border-color:#9db7e0}
  .it-title{font-weight:700;overflow-wrap:anywhere}
  .it-meta{grid-column:1;color:var(--sub);font-size:.86rem}
  .it-side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
  .prog{font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
  .foot-links{text-align:center;margin-top:18px;font-size:.9rem}

  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .mine-col{position:sticky;top:calc(var(--bar-h,60px) + 12px)}
  .mine-col .mine{margin:0;padding:14px;max-height:calc(100vh - var(--bar-h,60px) - 70px);overflow:auto}
  .col h2,.mine-col h2{min-height:26px;display:flex;align-items:center;gap:8px;margin:0 0 10px}
  @media (max-width:1150px){.home-grid{grid-template-columns:1fr}.mine-col{position:static;order:-1}.mine-col .mine{max-height:none}}
  .t-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
  .t-left{position:sticky;top:calc(var(--bar-h,60px) + 12px);max-height:calc(100vh - var(--bar-h,60px) - 24px);overflow:auto;display:grid;gap:12px}
  .t-left>.card{margin:0}
  .splitn{display:grid;gap:12px;align-items:start}
  .editing .bar,.editing #guide,.editing .editbtns{display:none}
  table.edtable{min-width:0}
  .edbar{margin-bottom:10px}
  .edbar .chk{font-weight:700}
  .item.on{background:#f7f3fe;border-color:#dfd3f6} .item.off{background:#fff6ea;border-color:#f2dcc0}
  a.item.on:hover{border-color:#b9a0ea} a.item.off:hover{border-color:#e3b579}
  .list li{position:relative}
  .col .list a.item{padding-right:48px}
  .it-edit{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:7px;border-radius:8px;color:var(--sub);line-height:0}
  .it-edit:hover{background:rgba(0,0,0,.07);color:var(--ink)}
  .home-top{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  .ht-left{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;min-width:0}
  .ht-right{display:flex;gap:6px;justify-content:flex-end;align-items:center}
  @media (max-width:1150px){.home-top{grid-template-columns:minmax(0,1fr) auto;gap:10px}}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;color:var(--sub);border:1.5px solid var(--line);background:#fff}
  .iconbtn:hover{color:var(--ink);border-color:#9db7e0}
  h1 .logo{height:1.5em;width:auto;max-width:2.4em;object-fit:contain;vertical-align:-.35em;margin-right:8px}
  .mrow{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:inherit;font-size:.9rem;background:#fff}
  .mrow.on{background:#f7f3fe;border-color:#dfd3f6} .mrow.off{background:#fff6ea;border-color:#f2dcc0}
  .mrow .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .mine .list{gap:5px;grid-template-columns:minmax(0,1fr)}
  .mine .list li{min-width:0}
  .mrow{min-width:0}
  .mrow .badge{flex:none}
  .mine h3{margin:12px 0 6px}
  .logo-prev{width:72px;height:72px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--sub);font-size:.8rem;overflow:hidden}
  .logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
  .sitelink{display:inline-block;margin-top:12px}
  .noticebox a{color:var(--accent-dark);overflow-wrap:anywhere}
  .lock{max-width:420px;margin:30px auto}
  .t-grid>.card{margin:0}
  @media (max-width:1050px){.t-grid{grid-template-columns:1fr}.t-left{position:static;max-height:none}}
  .badge.warn{background:#fdecea;color:var(--warn)}
  table.reg td.c-role{width:1%;white-space:nowrap}
  table.reg td.nm{width:1%}
  table.reg td.wrap{white-space:normal;overflow-wrap:anywhere}
  table.reg .f-period{min-width:150px} table.reg .f-course{min-width:280px} table.reg .f-number{min-width:190px}
  table.reg td.empty{background:#fff3f1}
  .mine .cols{grid-template-columns:1fr}
  .missing{grid-column:1/-1;color:var(--warn);font-size:.84rem;font-weight:700}
  .aibox{border:1.5px dashed #b9a6e6;background:#f7f3fe;border-radius:12px;padding:12px 14px}
  .aibox.drag{background:#ece3fd}
  .aibox b{color:var(--on)}
  .aibox p{margin:4px 0 8px}
  .ai-status{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .ai-status.bad{color:var(--warn)} .ai-status.good{color:var(--ok);font-weight:700}
  .ai-pickrows{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ai-pickrows button{padding:5px 10px;font-size:.86rem}
  .ainote{background:#f1ebfd;border-radius:9px;padding:8px 10px;font-size:.88rem;color:var(--on);font-weight:700}
  /* 연수 상세 */
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  dl.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:12px 0 0;font-size:.93rem}
  dl.meta dt{color:var(--sub);white-space:nowrap} dl.meta dd{margin:0;overflow-wrap:anywhere}
  .bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:8px}
  .bar input[type=search]{flex:1 1 200px;width:auto}
  .count{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
  .guide{margin:0 0 10px;color:var(--sub);font-size:.9rem}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table.reg,table.edit{border-collapse:collapse;width:100%}
  table.reg th,table.reg td,table.edit th,table.edit td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
  table.reg thead th,table.edit thead th{background:#f7f9fb;font-size:.85rem;white-space:nowrap}
  table.reg tbody tr{cursor:pointer}
  table.reg tbody tr:hover{background:#f5f9ff}
  table.reg tbody tr.done{background:#f6fbf8}
  table.reg tbody tr:last-child td,table.edit tbody tr:last-child td{border-bottom:0}
  table.reg td{white-space:nowrap}
  table.reg td.nm{font-weight:700}
  table.reg td.sg img{height:30px;max-width:90px;object-fit:contain;vertical-align:middle}
  .c-no{width:46px;text-align:center!important;color:var(--sub);font-variant-numeric:tabular-nums}
  .c-st{width:1%;text-align:right!important}
  .grp-row td{background:#eef2f7;font-weight:700;font-size:.85rem;color:var(--sub);cursor:default;padding:4px 10px!important}
  .editbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  /* 명부 관리 */
  table.edit{min-width:520px}
  table.edit td{padding:5px 6px}
  table.edit input,table.edit select{padding:6px 8px}
  .c-chk{width:36px;text-align:center!important} .c-chk input{width:17px;height:17px;margin:0;vertical-align:middle}
  .selbar{position:sticky;top:var(--bar-h,60px);z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:#fff;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
  .selbtns{display:flex;flex-wrap:wrap;gap:6px}
  .selbtns button{padding:6px 10px;font-size:.86rem}
  .selnum{font-weight:700;color:var(--accent-dark)}
  table.edit tr.picked td{background:#eef4fd}
  .c-grp{width:130px} .c-tools{width:150px;white-space:nowrap;text-align:right!important}
  .c-tools button{padding:4px 8px;font-size:.82rem}
  .groups{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .grp{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:3px 4px 3px 8px;background:#fff}
  .grp input{border:0;padding:4px;width:7.5em;font-weight:700}
  .grp small{color:var(--sub);white-space:nowrap}
  .grp button{border:0;padding:2px 7px;color:var(--sub)}

  /* 대화상자 */
  dialog{border:0;border-radius:16px;padding:22px;width:min(560px,94vw);max-height:92vh;overflow:auto;color:inherit;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(20,30,45,.45)}
  dialog h2{font-size:1.18rem}
  .stack{display:grid;gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
  .dbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg label{border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){border-color:var(--accent);background:#eaf1fc;color:var(--accent-dark)}
  .seg label:has(input:disabled){opacity:.55;cursor:default}
  .seg label:has(input:focus-visible){outline:3px solid #c9dcf7}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;min-width:0}
  legend{font-weight:700;font-size:.9rem;padding:0 4px}
  .checks{display:flex;flex-wrap:wrap;gap:8px 16px}
  form.t-online .only-off, form.t-offline .only-on{display:none}
  textarea{min-height:190px;resize:vertical}
  .who{font-size:1.15rem;font-weight:700;margin:0 0 12px}
  .who span{font-weight:500;color:var(--sub);font-size:.95rem;margin-left:6px}
  .padwrap{position:relative;border:2px dashed #9fb0c6;border-radius:12px;background:#fff;overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:2.2/1;touch-action:none;cursor:crosshair}
  .hint{position:absolute;inset:0;display:grid;place-items:center;color:#a6b1c0;pointer-events:none}
  .cursign{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--sub);margin-bottom:8px}
  .cursign img{height:40px;max-width:140px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}
  .err{color:var(--warn);font-weight:700;margin:10px 0 0}
  .req{color:var(--warn);font-weight:700;margin-left:2px}
  textarea.short{min-height:84px}
  .noticebox{margin:12px 0 0;background:#fff7e0;border:1px solid #ecd58b;border-radius:10px;padding:10px 12px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .noticebox b{display:block;margin-bottom:2px}
  .mine h2{margin-bottom:8px}
  .mine form{display:flex;gap:8px;flex-wrap:wrap}
  .mine form input{flex:1 1 120px;width:auto;min-width:0}
  .mine form button{padding:7px 11px}
  .mine-sum{margin:14px 0 10px;font-weight:700}
  .mine .cols{gap:12px}
  .mine h3{margin:0 0 8px;font-size:.95rem}
  .mine .item{padding:9px 12px}
  .mine .it-side{flex-direction:row;align-items:center}
  #dlg-qr{text-align:center}
  #dlg-qr img{width:min(400px,76vw);height:auto;image-rendering:pixelated}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2733;color:#fff;padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  #toast.on{opacity:1}
  footer{text-align:center;color:#9aa5b3;font-size:.78rem;padding:0 0 24px}

  /* 인쇄용 등록부 */
  .print-only{display:none}
  .sheet{color:#000;background:#fff}
  .sheet h2{text-align:center;font-size:18pt;margin:0 0 2mm;line-height:1.3;overflow-wrap:anywhere}
  .sheet .sub{display:flex;justify-content:space-between;gap:6mm;font-size:10.5pt;margin:0 0 2mm}
  .sheet .infobox{border:.3mm solid #000;padding:2.5mm 3.5mm;font-size:10.5pt;margin:0 0 3mm;line-height:1.7}
  .sheet table{border-collapse:collapse;width:100%;font-size:10pt}
  .sheet table.fixed{table-layout:fixed}
  .sheet th,.sheet td{border:.3mm solid #000;text-align:center;padding:0 1mm;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden}
  .sheet th{height:8mm;background:#eef0f3;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet .no{white-space:nowrap;padding:0;overflow-wrap:normal;font-variant-numeric:tabular-nums}
  .sheet .split{border-left:.7mm solid #000}
  .sheet td.sg{padding:.4mm}
  .sheet td.sg img{display:block;margin:0 auto;max-width:100%;object-fit:contain}
  .sheet.online .in td{height:7.6mm;padding:.6mm 1mm}
  .sheet.online .in{font-size:9pt}
  .sheet table.pagewrap>thead>tr>td,.sheet table.pagewrap>tfoot>tr>td{height:12mm;border:0;padding:0}
  .sheet table.pagewrap>tbody>tr>td{border:0;padding:0 12mm;text-align:left;overflow:visible}
  .sheet.online .in tr{break-inside:avoid}
  .sheet .pg{text-align:center;font-size:9pt;margin:2mm 0 0}
  @page{size:A4 portrait;margin:0}   /* 여백을 0으로 두면 브라우저의 머리글, 바닥글이 찍히지 않는다. 여백은 아래에서 직접 준다 */
  @media print{
    body{background:#fff}
    main{max-width:none;padding:0}
    .no-print,footer,#toast,dialog{display:none!important}
    .print-only{display:block}
    .sheet.offline{break-after:page;padding:12mm}
    .sheet.offline:last-child{break-after:auto}
  }
</style>
</head>
<body>
<main id="app"><p class="empty">불러오는 중입니다…</p></main>
<footer>made by 너펑이</footer>

<dialog id="dlg-form"></dialog>
<dialog id="dlg-entry"></dialog>
<dialog id="dlg-bulk">
  <h2>명부 한꺼번에 붙여넣기</h2>
  <div class="stack">
    <label class="f">어느 구분에 넣을까요? <select id="bulk-group"></select></label>
    <p class="muted small" style="margin:0">한 줄에 한 명씩 「직위/담당 이름」 순서로 적습니다. 엑셀이나 한글 표에서 두 칸(직위, 이름)을 복사해 그대로 붙여넣어도 됩니다. 이름 없이 직위만 적어도 됩니다.</p>
    <textarea id="bulk-text" placeholder="교장	김바른&#10;교감	이올바&#10;1-1	박하늘"></textarea>
  </div>
  <div class="dbtns">
    <button type="button" data-close>취소</button>
    <button type="button" id="bulk-ok" class="primary">명부에 추가</button>
  </div>
</dialog>
<dialog id="dlg-import">
  <h2>엑셀 명부 불러오기</h2>
  <p id="import-msg" style="margin:0"></p>
  <div class="dbtns">
    <button type="button" data-close>취소</button>
    <button type="button" id="import-replace" class="danger">지금 명부를 지우고 바꾸기</button>
    <button type="button" id="import-add" class="primary">지금 명부 뒤에 추가</button>
  </div>
</dialog>
<dialog id="dlg-qr">
  <h2 id="qr-title"></h2>
  <div id="qr-big"></div>
  <p class="muted" style="margin:10px 0 0">휴대폰 카메라로 QR 코드를 비추면 이 연수의 등록부가 열립니다.</p>
  <div class="dbtns" style="justify-content:center"><button type="button" data-close>닫기</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, getDocs, collection,
         onSnapshot, query, orderBy, serverTimestamp, getCountFromServer, arrayUnion, arrayRemove, deleteField }
  from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAB1pvTKdz4I2e2jVDWfsD93tNroSDS6t8",
  authDomain: "yeonsu-register.firebaseapp.com",
  projectId: "yeonsu-register",
  storageBucket: "yeonsu-register.firebasestorage.app",
  messagingSenderId: "512584387404",
  appId: "1:512584387404:web:6b021a133750417a661de9"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
let uid = null;

/* ───────── 기본값 ───────── */

/* 온라인 연수에서 받을 수 있는 입력 항목 */

  { key: 'period', label: '이수 기간', ph: '예: 11.3.~11.7.' },

/* ───────── 도구 ───────── */
const $app = document.getElementById('app');
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();
const rid = () => 'r' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const okImg = u => typeof u === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(u);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function fmtDate(v){
  if(!v) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!m) return v;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return `${+m[1]}. ${+m[2]}. ${+m[3]}.(${'일월화수목금토'[d.getDay()]})`;
}
function errText(e){
  const code = e && e.code || '';
  if(code.includes('admin-restricted-operation') || code.includes('operation-not-allowed') || code.includes('configuration-not-found'))
    return '파이어베이스 콘솔의 Authentication에서 「익명」 로그인이 켜져 있는지 확인해 주세요.';
  if(code.includes('permission-denied'))
    return '파이어베이스 콘솔의 Firestore 「규칙」 탭에 새 보안 규칙을 붙여넣고 게시했는지 확인해 주세요.';
  if(code.includes('unavailable') || code.includes('network'))
    return '인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
  return code || (e && e.message) || '알 수 없는 오류';
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}
function fail(e, what){ console.error(e); alert((what || '작업') + '에 실패했습니다.\n' + errText(e)); }
const pageUrl = id => location.origin + location.pathname + '#t/' + id;
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('링크를 복사했습니다'); }
  catch(_){ prompt('아래 링크를 복사해 주세요', text); }
}
function qrDataUrl(text){
  if(typeof window.qrcode !== 'function') return null;
  try{ const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(8, 16); }
  catch(_){ return null; }
}
const isOnline = t => t.type === 'online';
const fixUrl = u => { u = String(u || '').trim(); return !u ? '' : /^https?:\/\//i.test(u) ? u : 'https://' + u; };
/* 글 속의 주소(http, https)를 누를 수 있는 링크로 바꾼다 */
const linkify = text => esc(text).replace(/https?:\/\/[^\s<]+/g, m => { const tail = (m.match(/[.,;:!?)\]]+$/) || [''])[0]; const u = tail ? m.slice(0, -tail.length) : m; return `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>${tail}`; });
const fieldsOf = t => isOnline(t) ? FIELDS.filter(f => (t.fields || []).includes(f.key)) : [];
const isPast = t => !!t.due && t.due < today();
/* 기록은 했지만 비워 둔 칸(항목 key 목록). 전자서명이 필요한데 없으면 'sign' */
const missOf = (t, rec) => [
  ...fieldsOf(t).filter(f => !String(rec?.values?.[f.key] ?? '').trim()).map(f => f.key),
  ...(t.needSign && !okImg(rec?.sign) ? ['sign'] : [])];
const fieldLabel = k => k === 'sign' ? '전자서명' : (FIELDS.find(f => f.key === k) || {}).label || k;

const S = {

function scheduleSave(fn){ S.saveFn = fn; clearTimeout(S.saveTimer); S.saveTimer = setTimeout(flushSave, 600); }
async function flushSave(){
  clearTimeout(S.saveTimer); S.saveTimer = null;
  const fn = S.saveFn; S.saveFn = null;
  if(!fn) return;
  try{ await fn(); toast('저장했습니다'); } catch(e){ fail(e, '저장'); }
}
window.addEventListener('beforeunload', () => { if(S.saveFn) flushSave(); });

const schoolYear = () => { const d = new Date(); return String(d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1); };   // 3월에 새 학년도
const okLogo = u => typeof u === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(u);
const inYear = t => (t.year || S.app.year) === S.app.year;
function applyLogo(){
  let link = document.querySelector('link[rel="icon"]');
  if(okLogo(S.app.logo)){ if(!link){ link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); } link.href = S.app.logo; }
  else if(link) link.remove();
}
function saveApp(){ return setDoc(doc(db, 'settings', 'app'), { year: S.app.year, logo: S.app.logo || '', updatedAt: serverTimestamp() }); }
async function loadRoster(){
  const [snap, appSnap] = await Promise.all([getDoc(doc(db, 'settings', 'roster')), getDoc(doc(db, 'settings', 'app'))]);
  const a = appSnap.exists() ? appSnap.data() : {};
  S.app = { year: a.year || schoolYear(), logo: a.logo || '', saved: !!a.year };
  applyLogo();
  const d = snap.exists() ? snap.data() : {};
  const groups = (d.groups && d.groups.length ? d.groups : DEFAULT_GROUPS).map(g => ({ id: g.id, name: g.name }));
  const members = (d.members || []).map(m => ({ id: m.id || rid(), group: m.group, role: m.role || '', name: m.name || '' }));
  S.roster = { school: d.school || DEFAULT_SCHOOL, groups, members };
  sortMembers();
  return S.roster;
}
function sortMembers(){
  const r = S.roster, ids = r.groups.map(g => g.id);
  r.members.forEach(m => { if(!ids.includes(m.group)) m.group = ids[0]; });
  r.members = r.groups.flatMap(g => r.members.filter(m => m.group === g.id));
}
function saveRoster(){
  const r = S.roster;
  return setDoc(doc(db, 'settings', 'roster'), { school: r.school, groups: r.groups, members: r.members, updatedAt: serverTimestamp() });
}

/* 이름으로 내가 기록한 연수, 아직 기록하지 않은 연수 찾기 */
async function findMine(name){
  const box = $('#mine-result'), q = norm(name);
  try{ if(q) localStorage.setItem('mineName', name.trim()); else localStorage.removeItem('mineName'); }catch(_){}
  if(!q){ box.innerHTML = '<p class="muted small" style="margin:10px 0 0">이름을 넣으면 내가 기록한 연수와 아직 기록하지 않은 연수를 찾아 줍니다.</p>'; return; }
  box.innerHTML = '<p class="muted small" style="margin:12px 0 0">찾는 중입니다…</p>';
  /* 예전에 만든 연수는 기록 요약이 없을 수 있어 한 번 읽어 온다 */
  await Promise.all(S.list.filter(t => !t.done).map(async t => {
    const m = {}; (await getDocs(collection(db, 'trainings', t.id, 'records'))).forEach(d => { m[d.id] = d.data().name || ''; });
    t.done = m;
  }));
  const todo = [], done = [], unknown = [];
  S.list.forEach(t => {
    let hit = false;
    (t.rows || []).forEach(r => {
      const rec = r.id in t.done;
      if(norm(r.name) === q || (rec && norm(t.done[r.id]) === q)){ hit = true; (rec ? done : todo).push({ t, r, miss: rec ? ((t.miss || {})[r.id] || []) : [] }); }
    });
    if(!hit) unknown.push(t);
  });
  done.sort((a, b) => (b.miss.length ? 1 : 0) - (a.miss.length ? 1 : 0));
  const partial = done.filter(x => x.miss.length).length;
  const item = ({ t, r, miss }) => `<li><a class="mrow ${isOnline(t) ? 'on' : 'off'}" href="#t/${esc(t.id)}/${esc(r.id)}" title="${esc([t.title, r.role].filter(Boolean).join(' / '))}">
      <span class="mt">${esc(t.title)}</span>
      ${miss.length ? `<span class="badge warn" title="아직 입력하지 않은 칸: ${esc(miss.map(fieldLabel).join(', '))}">미입력 ${miss.length}칸</span>` : ''}
      <span class="badge ${isOnline(t) ? 'on' : 'off'}">${isOnline(t) ? '온라인' : '대면'}</span></a></li>`;
  const blank = unknown.filter(t => (t.rows || []).some(r => !r.name && !(r.id in t.done)));
  const none = '<p class="muted small" style="margin:0">없습니다.</p>';
  box.innerHTML = `
    <h3 class="mine-sum">아직 기록하지 않은 연수 ${todo.length}건</h3>${todo.length ? `<ul class="list">${todo.map(item).join('')}</ul>` : none}
    <h3>기록한 연수 ${done.length}건${partial ? ` (덜 입력 ${partial}건)` : ''}</h3>${done.length ? `<ul class="list">${done.map(item).join('')}</ul>` : none}
    ${blank.length ? `<p class="muted small" style="margin:10px 0 0" title="${esc(blank.map(t => t.title).join(', '))}">이름이 빈 줄이 있어 대상인지 알 수 없는 연수 ${blank.length}건</p>` : ''}`;
}

        <label><input type="radio" name="type" value="online" ${t.type === 'online' ? 'checked' : ''} ${existing ? 'disabled' : ''}>온라인 연수</label>
        <label><input type="radio" name="type" value="offline" ${t.type === 'offline' ? 'checked' : ''} ${existing ? 'disabled' : ''}>대면 연수</label>
      </div>
      <label class="f">연수명<span class="req">*</span> <input type="text" name="title" required value="${esc(t.title)}" placeholder="예: 2026 학교안전교육 연수"></label>
      ${`<fieldset><legend>${existing ? '명부에서 대상 추가로 불러오기 (이미 명단에 있는 사람은 건너뜁니다)' : '연수 대상 (명부에서 한 번에 불러오기)'}</legend>
        ${r.members.length ? `<div class="checks">${r.groups.map(g => `<label class="chk"><input type="checkbox" name="grp" value="${esc(g.id)}"> ${esc(g.name)} <small class="muted">${cnt(g.id)}명</small></label>`).join('')}</div>`
          : '<p class="muted small" style="margin:0">명부가 비어 있습니다. 빈 명단으로 만들어지고, 나중에 사람을 추가할 수 있습니다.</p>'}
      </fieldset>`}
      <div class="two">
        <label class="f">연수대상 표기 <input type="text" name="target" value="${esc(t.target)}" placeholder="예: 전직원, 교원"></label>
        <label class="f">담당자 <input type="text" name="manager" value="${esc(t.manager)}"></label>
      </div>

      <div class="only-on stack">
        <div class="two">
          <label class="f">완료요구일 <input type="date" name="due" value="${esc(isOnline(t) ? t.due : '')}"></label>
          <label class="f">교육기관 <input type="text" name="org" value="${esc(t.org)}" placeholder="예: 경기도교육청 온라인 연수원"></label>
        </div>
        <div class="two">
          <label class="f">이수기간 <input type="text" name="period" value="${esc(t.period)}" placeholder="예: 2026.11.1.~11.30."></label>
          <fieldset><legend>이수증 제출 여부</legend>
            <div class="checks">${['제출', '미제출'].map(o => `<label class="chk"><input type="checkbox" name="certNote" value="${o}" ${t.certNote === o ? 'checked' : ''}> ${o}</label>`).join('')}</div>
          </fieldset>
        </div>
        <label class="f">연수원 링크 <input type="text" name="link" inputmode="url" value="${esc(t.link)}" placeholder="예: https://www.gseek.kr (연수 화면에 바로 가기 버튼이 생깁니다)"></label>
        <fieldset><legend>각자 입력할 항목</legend>
          <div class="checks">${FIELDS.map(f => `<label class="chk"><input type="checkbox" name="fld" value="${f.key}" ${(t.fields || []).includes(f.key) ? 'checked' : ''}> ${f.label}</label>`).join('')}
            <label class="chk"><input type="checkbox" name="fldSign" ${isOnline(t) && t.needSign ? 'checked' : ''}> 전자서명</label></div>
        </fieldset>
      </div>

      <div class="only-off stack">
        <div class="two">
          <label class="f">연수 날짜<span class="req">*</span> <input type="date" name="date" ${t.type === 'offline' ? 'required' : ''} value="${esc(!isOnline(t) ? t.due : '')}"></label>
          <label class="f">시간 <input type="text" name="time" value="${esc(t.time)}" placeholder="예: 15:00~16:30"></label>
        </div>
        <label class="f">장소 <input type="text" name="place" value="${esc(t.place)}" placeholder="예: 시청각실"></label>
        <p class="muted small" style="margin:0">대면 연수는 명단에서 본인 줄을 눌러 전자서명을 받습니다.</p>
      </div>

      <label class="f">연수 관련 안내 사항 <textarea name="notice" class="short" style="margin-top:4px;font-weight:400" placeholder="예: 이수 후 이수증을 교무실로 제출해 주세요. 연수 주소: ...">${esc(t.notice)}</textarea></label>
    </div>
    <div class="dbtns"><button type="button" data-close>취소</button><button type="submit" class="primary">${existing ? '저장' : '등록'}</button></div>
  </form>`;
  const form = $('#tform');
  const tgt = form.elements.target;
  let auto = !existing;
  tgt.addEventListener('input', () => { auto = false; });
  form.addEventListener('change', e => {
    if(e.target.name === 'type'){ form.className = 't-' + e.target.value; form.elements.date.required = e.target.value === 'offline'; }
    if(e.target.name === 'certNote' && e.target.checked)
      form.querySelectorAll('[name=certNote]').forEach(c => { if(c !== e.target) c.checked = false; });
    if(e.target.name === 'grp' && auto){
      const on = [...form.querySelectorAll('[name=grp]:checked')].map(c => c.value);
      tgt.value = on.length === r.groups.length && on.length > 1 ? '전직원' : r.groups.filter(g => on.includes(g.id)).map(g => g.name).join(', ');
    }
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try{
      const v = n => (form.elements[n]?.value || '').trim();
      const type = existing ? existing.type : form.querySelector('[name=type]:checked').value;
      const data = { title: v('title'), target: v('target'), manager: v('manager'), notice: v('notice') };
      if(type === 'online') Object.assign(data, {
        due: v('due'), needSign: form.elements.fldSign.checked, org: v('org'), period: v('period'), link: fixUrl(v('link')),
        certNote: (form.querySelector('[name=certNote]:checked') || {}).value || '',
        fields: [...form.querySelectorAll('[name=fld]:checked')].map(c => c.value) });
      else Object.assign(data, { due: v('date'), time: v('time'), place: v('place'), needSign: true, fields: [] });
      if(existing){
        const on = [...form.querySelectorAll('[name=grp]:checked')].map(c => c.value);
        const has = new Set((existing.rows || []).map(x => norm(x.role) + '|' + norm(x.name)));
        const add = r.groups.filter(g => on.includes(g.id)).flatMap(g =>
          r.members.filter(m => m.group === g.id && !has.has(norm(m.role) + '|' + norm(m.name))).map(m => ({ id: rid(), group: g.name, role: m.role, name: m.name })));
        if(add.length) data.rows = arrayUnion(...add);
        await updateDoc(doc(db, 'trainings', tid), data);
        dlg.close(); toast(add.length ? `저장했습니다 (명단에 ${add.length}명 추가)` : '저장했습니다');
        if(!S.tid) route();
      }else{
        const on = [...form.querySelectorAll('[name=grp]:checked')].map(c => c.value);
        if(r.members.length && !on.length && !confirm('연수 대상을 고르지 않았습니다.\n빈 명단으로 등록할까요?')){ btn.disabled = false; return; }
        const rows = r.groups.filter(g => on.includes(g.id)).flatMap(g =>
          r.members.filter(m => m.group === g.id).map(m => ({ id: rid(), group: g.name, role: m.role, name: m.name })));
        const ref = await addDoc(collection(db, 'trainings'), { ...data, type, rows, year: S.app.year, done: {}, miss: {}, archived: false, createdAt: serverTimestamp() });
        dlg.close();
        location.hash = 't/' + ref.id;
      }
    }catch(err){ fail(err, existing ? '저장' : '연수 등록'); btn.disabled = false; }
  });
  dlg.showModal();
}

/* ───────── 연수 상세: 명단에 기록, 서명 ───────── */
/* 연수 문서의 done(누가 기록했는지 요약)을 실제 기록과 맞춘다. 첫 화면의 「내 연수 기록 찾기」가 이 요약을 읽는다 */
let syncTimer = null;
function syncDone(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    if(!S.t || !S.tid) return;
    const want = {}, wantMiss = {};
    Object.keys(S.recs).sort().forEach(k => { want[k] = S.recs[k].name || ''; const m = missOf(S.t, S.recs[k]); if(m.length) wantMiss[k] = m; });
    const sorted = o => { const x = {}; Object.keys(o || {}).sort().forEach(k => { x[k] = o[k]; }); return JSON.stringify(x); };
    if(S.t.done && sorted(S.t.done) === sorted(want) && sorted(S.t.miss) === sorted(wantMiss)) return;
    try{ await updateDoc(doc(db, 'trainings', S.tid), { done: want, miss: wantMiss }); }catch(e){ console.error(e); }
  }, 1500);
}

    return;
  }
  if(!S.roster) await loadRoster();
  S.tid = id; S.t = { rows: [], ...snap.data() };
  const qr = qrDataUrl(pageUrl(id));
  $app.innerHTML = `

        <button data-act="edit">연수 정보 수정</button>

        <p class="muted small" style="margin:10px 0 0">넣은 이수증은 이 앱에 저장되지 않고, 읽은 뒤 바로 버려집니다. 저장되는 것은 확인 후 「저장」을 누른 글자 내용뿐입니다.</p>
      </section>

  $('#q').addEventListener('input', paintRows);

  S.unsubs.push(onSnapshot(doc(db, 'trainings', id), s => {

    S.t = { rows: [], ...s.data() }; paintInfo(); paintRows(); syncDone();
  }, e => console.error(e)));
  S.unsubs.push(onSnapshot(collection(db, 'trainings', id, 'records'), s => {
    const m = {}; s.forEach(x => { m[x.id] = x.data(); });
    S.recs = m; paintRows(); syncDone();
    if(openRow){ const row = S.t.rows.find(r => r.id === openRow); openRow = null; if(row && !$('#dlg-entry').open) openEntry(row); }

  document.title = t.title || '연수 등록부';
  const rows = [['연수대상', t.target], ['담당자', t.manager]];
  if(isOnline(t)) rows.push(['완료요구일', fmtDate(t.due)], ['교육기관', t.org], ['이수기간', t.period], ['이수증 제출 여부', t.certNote]);
  else rows.push(['일시', [fmtDate(t.due), t.time].filter(Boolean).join(' ')], ['장소', t.place]);

    : '본인 줄을 눌러 서명해 주세요. 명단에 없으면 아래 「명단에 없는 사람 추가」를 누릅니다.';

const nameOf = r => (S.recs[r.id] && S.recs[r.id].name) || r.name || '';
/* 명단을 몇 단으로 나눌지: 대면 연수는 넓은 화면에서 3단까지 */
function colCount(mount, max){ const w = mount.clientWidth; return Math.min(max, w >= 1000 ? 3 : w >= 620 ? 2 : 1); }
function splitTables(list, n, table){
  if(n <= 1 || list.length <= 10) return table(list);
  const per = Math.ceil(list.length / n), parts = [];
  for(let k = 0; k < n; k++){ const part = list.slice(k * per, (k + 1) * per); if(part.length) parts.push(table(part)); }
  return `<div class="splitn" style="grid-template-columns:repeat(${parts.length},minmax(0,1fr))">${parts.join('')}</div>`;
}
/* 명단 편집 모드: 직위와 성명을 칸에서 바로 고치고, 여러 명을 골라 한 번에 뺀다. 「명단 저장」을 눌러야 반영된다 */
function paintEdit(){
  const t = S.t, mount = $('#tables'), e = S.edit;
  const rows = t.rows.filter(r => !e.del.has(r.id));
  rows.forEach(r => { if(!e.vals[r.id]) e.vals[r.id] = { role: r.role || '', name: nameOf(r) }; });
  const head = '<thead><tr><th class="c-chk"></th><th class="c-no">연번</th><th>직위/담당</th><th>성명</th><th class="c-st"></th></tr></thead>';
  const items = rows.map((r, i) => ({ html: `<tr data-ed="${esc(r.id)}" class="${e.sel.has(r.id) ? 'picked' : ''}">
      <td class="c-chk"><input type="checkbox" data-edsel aria-label="선택" ${e.sel.has(r.id) ? 'checked' : ''}></td><td class="c-no">${i + 1}</td>
      <td><input type="text" data-edf="role" value="${esc(e.vals[r.id].role)}" aria-label="직위/담당"></td>
      <td><input type="text" data-edf="name" value="${esc(e.vals[r.id].name)}" aria-label="성명"></td>
      <td class="c-st">${S.recs[r.id] ? '<span class="badge ok">기록 있음</span>' : ''}</td></tr>` }));
  const table = list => `<div class="tablewrap"><table class="edit edtable">${head}<tbody>${list.map(x => x.html).join('')}</tbody></table></div>`;
  mount.innerHTML = `<div class="selbar edbar">
      <label class="chk"><input type="checkbox" id="ed-all" ${rows.length && e.sel.size === rows.length ? 'checked' : ''}> 전체 선택 <span class="muted" id="ed-count" style="font-weight:400"></span></label>
      <span class="selbtns"><button class="danger" data-act="ed-del">선택한 사람 빼기</button><button data-act="ed-cancel">취소</button><button class="primary" data-act="ed-save">명단 저장</button></span>
    </div>` + (items.length ? splitTables(items, colCount(mount, 2), table) : '<p class="empty" style="border:1px solid var(--line);border-radius:10px;margin:0">명단에 남은 사람이 없습니다.</p>');
  paintEditCount();
}
function paintEditCount(){
  const e = S.edit, el = $('#ed-count'); if(!e || !el) return;
  el.textContent = [e.sel.size ? `${e.sel.size}명 선택` : '', e.del.size ? `뺄 사람 ${e.del.size}명 (저장하면 반영)` : ''].filter(Boolean).join(', ');
}
function paintRows(force){
  const t = S.t, mount = $('#tables'); if(!t || !mount) return;
  mount.parentElement.classList.toggle('editing', !!S.edit);
  if(S.edit){ if(force === true || !mount.querySelector('.edbar')) paintEdit(); return; }
  const fields = fieldsOf(t);
  const q = norm($('#q').value), todo = $('#only-todo').checked;
  const span = 4 + fields.length + (t.needSign ? 1 : 0);
  const head = `<thead><tr><th class="c-no">연번</th><th>직위/담당</th><th>성명</th>${fields.map(f => `<th class="f-${f.key}">${f.label}</th>`).join('')}${t.needSign ? '<th>서명</th>' : ''}<th class="c-st"></th></tr></thead>`;
  let done = 0, part = 0;
  const items = [];
  t.rows.forEach((r, i) => {
    const rec = S.recs[r.id]; if(rec) done++;
    const miss = rec ? missOf(t, rec) : [];
    if(miss.length) part++;
    const name = nameOf(r);
    if(todo && rec) return;
    if(q && !norm(name + r.role).includes(q)) return;
    items.push({ group: r.group, html: `<tr data-row="${esc(r.id)}" tabindex="0" class="${rec ? 'done' : ''}">
      <td class="c-no">${i + 1}</td><td class="c-role">${esc(r.role)}</td><td class="nm">${esc(name)}</td>
      ${fields.map(f => `<td class="wrap f-${f.key}${miss.includes(f.key) ? ' empty' : ''}">${esc(rec?.values?.[f.key] ?? '')}</td>`).join('')}
      ${t.needSign ? `<td class="sg${miss.includes('sign') ? ' empty' : ''}">${rec && okImg(rec.sign) ? `<img src="${rec.sign}" alt="서명 완료">` : ''}</td>` : ''}
      <td class="c-st">${!rec ? `<span class="badge sign">${isOnline(t) ? '입력하기' : '서명하기'}</span>`
        : miss.length ? `<span class="badge warn" title="미입력: ${esc(miss.map(fieldLabel).join(', '))}">미입력 ${miss.length}칸</span>` : '<span class="badge ok">완료</span>'}</td></tr>` });
  });
  const table = list => {
    let last = null, body = '';
    list.forEach(x => {
      if(x.group && x.group !== last){ last = x.group; body += `<tr class="grp-row"><td colspan="${span}">${esc(x.group)}</td></tr>`; }
      body += x.html;
    });
    return `<div class="tablewrap"><table class="reg">${head}<tbody>${body}</tbody></table></div>`;
  };
  if(!items.length) mount.innerHTML = `<p class="empty" style="border:1px solid var(--line);border-radius:10px;margin:0">${t.rows.length ? '조건에 맞는 사람이 없습니다.' : '명단이 비어 있습니다. 아래 버튼으로 사람을 추가해 주세요.'}</p>`;
  else mount.innerHTML = splitTables(items, isOnline(t) ? 1 : colCount(mount, 3), table);   /* 대면 연수 서명 명단은 좌우로 나눈다 */
  $('#count').textContent = `기록 ${done}/${t.rows.length}` + (part ? ` (일부 미입력 ${part}명)` : '');
  renderSheets();
}

/* 한 사람의 기록, 서명 창 */
function openEntry(row, prefill){
  if(!prefill && S.pendingAI){ prefill = S.pendingAI; }
  S.pendingAI = null;
  const t = S.t, isNew = !row;
  const rec = row ? S.recs[row.id] : null;
  const fields = fieldsOf(t);
  const groups = [...new Set([...S.roster.groups.map(g => g.name), ...t.rows.map(r => r.group).filter(Boolean)])];

function setupPad(canvas, hint){
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.8 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
  let drawing = false, last = null, ink = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    drawing = true; last = pos(e); ink = true; hint.hidden = true;
    ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  return {
    hasInk: () => ink,
    clear(){ ctx.clearRect(0, 0, canvas.width, canvas.height); ink = false; hint.hidden = false; },
    toDataURL(){   /* 여백을 잘라 작은 투명 PNG로 만든다 */
      const w = canvas.width, h = canvas.height;
      const d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        if(d[(y * w + x) * 4 + 3] > 12){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
      }
      if(x1 < 0) return canvas.toDataURL('image/png');
      const m = Math.round(6 * dpr);
      x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
      const s = Math.min(480 / bw, 200 / bh, 2.5);
      const out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(bw * s)); out.height = Math.max(1, Math.round(bh * s));
      const o = out.getContext('2d'); o.imageSmoothingQuality = 'high';
      o.drawImage(canvas, x0, y0, bw, bh, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }
  };
}

/* ───────── AI(Gemini)로 이수증 읽기 ───────── */
const AI_KEYS = ['period', 'course', 'number', 'hours'];
const AI_BASE = 'https://generativelanguage.googleapis.com/v1beta';
/* 모델 목록을 못 받아 왔을 때 차례로 시도할 이름들 */
const AI_FALLBACK = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-flash-latest', 'gemini-3.1-flash-lite', 'gemini-2.5-flash', 'gemini-2.5-flash-lite'];
const AI = { key: undefined, listFor: null, list: null };
async function getAiKey(force){
  if(AI.key !== undefined && !force) return AI.key;
  const s = await getDoc(doc(db, 'settings', 'ai'));
  AI.key = s.exists() ? (s.data().key || '') : '';
  return AI.key;
}
/* 이 키로 쓸 수 있는 모델을 구글에 물어보고, 최신 flash부터 차례로 시도할 목록을 만든다 */
async function aiCandidates(key){
  if(AI.listFor === key && AI.list) return AI.list;
  let listed = [];
  try{
    const r = await fetch(`${AI_BASE}/models?pageSize=1000`, { headers: { 'x-goog-api-key': key } });
    if(r.ok){
      const j = await r.json();
      listed = (j.models || []).filter(m => !m.supportedGenerationMethods || m.supportedGenerationMethods.includes('generateContent'))
        .map(m => String(m.name).replace(/^models\//, ''));
    }
  }catch(_){}
  const ver = n => { const m = /^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(n); return m ? { v: parseFloat(m[1]), lite: m[2] ? 1 : 0 } : null; };
  const ranked = listed.filter(ver).sort((a, b) => (ver(a).lite - ver(b).lite) || (ver(b).v - ver(a).v));
  const alias = listed.filter(n => /^gemini-flash(-lite)?-latest$/.test(n));
  let saved = ''; try{ saved = localStorage.getItem('aiModel') || ''; }catch(_){}
  if(listed.length && !listed.includes(saved)) saved = '';
  AI.listFor = key;
  AI.list = [...new Set([saved, ...ranked, ...alias, ...AI_FALLBACK].filter(Boolean))].slice(0, 12);
  return AI.list;
}
function parseAiJson(text){
  const t = String(text || '').replace(/```(?:json)?/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a < 0 || b <= a) return null;
  try{ return JSON.parse(t.slice(a, b + 1)); }catch(_){ return null; }
}
/* 모델을 차례로 바꿔 가며 요청한다. 성공한 모델은 기억해 두고 다음에 먼저 쓴다 */
async function geminiJSON(key, parts, onTry){
  const models = await aiCandidates(key), errs = [];
  for(const model of models){
    if(onTry) onTry(model);
    let r;
    try{
      r = await fetch(`${AI_BASE}/models/${model}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } }) });
    }catch(e){ errs.push(`${model}: 연결 실패`); continue; }
    const j = await r.json().catch(() => ({}));
    if(r.ok){
      const data = parseAiJson(((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join(''));
      if(data){ try{ localStorage.setItem('aiModel', model); }catch(_){} AI.list = [model, ...models.filter(m => m !== model)]; return { data, model }; }
      errs.push(`${model}: 답을 읽지 못함`); continue;
    }
    const msg = (j.error && j.error.message) || r.statusText || '';
    if(r.status === 401) throw new Error(`API 키가 거부되었습니다 (401).\n${msg}\n「관리자 설정」에서 키를 다시 확인해 주세요.`);
    errs.push(`${model}: ${r.status} ${msg}`.slice(0, 160));
  }
  throw new Error('사용할 수 있는 모델을 찾지 못했습니다.\n' + errs.join('\n'));
}
function fileToDataUrl(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('파일을 읽지 못했습니다.')); fr.readAsDataURL(file); });
}
/* 사진은 긴 변 2000px 이하 JPEG로 줄여 보내고, PDF는 그대로 보낸다 */
async function fileToPart(file){
  if(file.type.startsWith('image/')){
    try{
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      return { inline_data: { mime_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.9).split(',')[1] } };
    }catch(_){ /* 브라우저가 못 여는 형식이면 원본 그대로 */ }
  }
  const url = await fileToDataUrl(file);
  return { inline_data: { mime_type: file.type || 'application/octet-stream', data: url.split(',')[1] } };
}
const CERT_PROMPT = `첨부한 것은 한국의 교원 또는 공무원 연수 이수증(또는 이수 내역 화면을 캡처한 것)입니다.
아래 항목을 문서에 적힌 그대로 찾아 JSON 객체 하나로만 답하세요. 문서에 없는 항목은 빈 문자열("")로 두고, 추측해서 채우지 마세요.
{
  "name": "이수한 사람의 성명",
  "course": "과정명(연수명). 여러 줄로 나뉘어 있으면 한 줄로 이어서",
  "period": "연수 기간(이수 기간). 예: 2026.10.29.~2026.11.02.",
  "number": "이수 번호. 보통 문서 맨 위에 '제 ○○-○○-2026-123456 호'처럼 적혀 있음. '제'와 '호'를 포함해 적힌 그대로",
  "hours": "이수 시간. 예: 15시간"
}
생년월일, 근무 기관 같은 그 밖의 내용은 답에 넣지 마세요.`;
/* 이수증 넣는 상자 공용 처리: 파일 고르기, 끌어다 놓기, 붙여넣기 → Gemini로 읽어 onData에 넘긴다.
   파일은 이 함수 안에서만 쓰고 어디에도 저장하지 않는다 (읽은 뒤 참조를 버린다) */
function wireCertBox(box, pasteTarget, onData, skip){
  const st = box.querySelector('.ai-status'), fileInput = box.querySelector('.ai-file'), pick = box.querySelector('.ai-pick');
  const say = (msg, cls) => { st.textContent = msg; st.className = 'ai-status small ' + (cls || 'muted'); st.hidden = false; };
  let busy = false;
  async function run(file){
    if(busy || !file) return;
    if(!file.type.startsWith('image/') && file.type !== 'application/pdf') return say('사진(JPG, PNG 등)이나 PDF 파일만 읽을 수 있습니다.', 'bad');
    if(file.size > 15 * 1024 * 1024) return say('파일이 너무 큽니다. 15MB 이하 파일을 올려 주세요.', 'bad');
    busy = true; pick.disabled = true;
    try{
      say('이수증을 읽는 중입니다…');
      const key = await getAiKey();
      if(!key){ say('AI 키가 아직 등록되지 않았습니다. 담당 선생님께 알려 주세요. (첫 화면 아래 「관리자 설정」에서 Gemini API 키를 넣어야 합니다)', 'bad'); return; }
      let part = await fileToPart(file);
      file = null;
      const { data, model } = await geminiJSON(key, [part, { text: CERT_PROMPT }], m => say(`이수증을 읽는 중입니다… (${m})`));
      part = null;                                   // 이수증 내용은 여기서 버린다
      const clean = {}; ['name', ...AI_KEYS].forEach(k => { clean[k] = String(data[k] ?? '').trim(); });
      onData(clean, model, say);
    }catch(e){ console.error(e); say('AI로 읽지 못했습니다. 직접 입력해 주세요.\n' + (e.message || ''), 'bad'); }
    finally{ busy = false; pick.disabled = false; }
  }
  pick.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; fileInput.value = ''; run(f); });
  const onPaste = e => {
    if(skip && skip()) return;
    const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && (i.type.startsWith('image/') || i.type === 'application/pdf'));
    if(it){ e.preventDefault(); run(it.getAsFile()); }
  };
  pasteTarget.addEventListener('paste', onPaste);
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });
  box.addEventListener('dragleave', () => box.classList.remove('drag'));
  box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('drag'); run(e.dataTransfer.files[0]); });
  return () => pasteTarget.removeEventListener('paste', onPaste);
}
/* 기록 창 안의 상자: 지금 열린 사람의 칸을 채운다 */
function setupCertAI(form){
  wireCertBox($('#aibox'), form, (data, model, say) => {
    const filled = [];
    AI_KEYS.forEach(k => { const el = form.elements['v_' + k]; if(el && data[k]){ el.value = data[k]; filled.push(fieldLabel(k)); } });
    const cur = form.elements.name.value.trim();
    let warn = '';
    if(data.name && !cur){ form.elements.name.value = data.name; filled.unshift('성명'); }
    else if(data.name && norm(data.name) !== norm(cur)) warn = `\n이수증의 이름은 「${data.name}」입니다. 본인 이수증이 맞는지 확인해 주세요.`;
    if(filled.length) say(`채운 칸: ${filled.join(', ')}. 내용을 확인한 뒤 저장해 주세요. (${model})` + warn, warn ? 'bad' : 'good');
    else say('이수증에서 해당하는 내용을 찾지 못했습니다. 직접 입력해 주세요.' + warn, 'bad');
  });
}

    if(!AI_KEYS.some(k => data[k]) && !data.name) return say('이수증에서 내용을 찾지 못했습니다. 명단에서 본인 줄을 눌러 직접 입력해 주세요.', 'bad');
    const read = AI_KEYS.filter(k => data[k] && fieldsOf(S.t).some(f => f.key === k)).map(fieldLabel).join(', ');
    if(!data.name){
      S.pendingAI = data;
      return say(`이수증에서 이름은 찾지 못했습니다. 읽은 내용: ${read || '없음'}\n오른쪽 명단에서 본인 줄을 누르면 읽은 내용이 채워집니다. (${model})`, 'bad');
    }
    const same = S.t.rows.filter(r => norm(nameOf(r)) === norm(data.name));
    if(same.length === 1){
      say(`「${data.name}」 님을 명단에서 찾았습니다. 입력 창에서 확인한 뒤 저장해 주세요. (${model})`, 'good');

      say(`「${data.name}」 님이 명단에 ${same.length}명 있습니다. 본인을 골라 주세요. (${model})`, 'bad');
      return choose('', same, data, false);
    }
    S.pendingAI = data;
    say(`명단에 「${data.name}」 님의 이름이 없습니다. 읽은 내용: ${read || '없음'}\n오른쪽 명단에서 본인 직위 줄을 누르면 읽은 내용과 이름이 채워집니다. 명단에 아예 없는 분이면 아래 버튼을 눌러 주세요. (${model})`, 'bad');

  }, () => !!document.querySelector('dialog[open]'));   /* 창이 열려 있을 때의 붙여넣기는 그 창이 처리한다 */
  S.unsubs.push(off);
}

const PRINT_W = { period: '15%', number: '17%', hours: '8%', cert: '8%' };   // 연수명은 남는 너비를 모두 쓴다
function renderSheets(){
  const mount = $('#sheets'), t = S.t; if(!mount || !t) return;
  const school = S.roster ? S.roster.school : DEFAULT_SCHOOL;
  const rows = t.rows;
  const signImg = (r, h) => { const rec = S.recs[r.id]; return rec && okImg(rec.sign) ? `<img src="${rec.sign}" alt="서명" style="max-height:${h}mm">` : ''; };

  if(isOnline(t)){
    const fields = fieldsOf(t);
    const info = [['교육기관', t.org], ['이수기간', t.period], ['이수증 제출 여부', t.certNote]];
    mount.innerHTML = `<section class="sheet online"><table class="pagewrap"><thead><tr><td></td></tr></thead><tfoot><tr><td></td></tr></tfoot><tbody><tr><td>
      <h2>${esc(t.title)}</h2>
      <p class="sub"><span>연수 이수명단</span><span>${esc(school)}</span></p>
      <div class="infobox">${info.map((x, i) => `${i + 1}) ${x[0]}: ${esc(x[1] || '')}`).join('<br>')}</div>
      <table class="in"><thead><tr><th class="no" style="width:5%">연번</th><th style="width:10%">직위/담당</th><th style="width:9%">성명</th>${fields.map(f => `<th${PRINT_W[f.key] && !(f.key === 'number' && !fields.some(x => x.key === 'course')) ? ` style="width:${PRINT_W[f.key]}"` : ''}>${f.label}</th>`).join('')}${t.needSign ? '<th style="width:11%">서명</th>' : ''}</tr></thead>
      <tbody>${rows.map((r, i) => { const rec = S.recs[r.id];
        return `<tr><td class="no">${i + 1}</td><td>${esc(r.role)}</td><td>${esc(nameOf(r))}</td>${fields.map(f => `<td>${esc(rec?.values?.[f.key] ?? '')}</td>`).join('')}${t.needSign ? `<td class="sg">${signImg(r, 6.6)}</td>` : ''}</tr>`; }).join('')}</tbody></table>
    </td></tr></tbody></table></section>`;
    return;
  }
  /* 대면 연수: 기존 시트처럼 좌우 2단 */
  const P = Math.min(35, Math.max(15, Math.ceil(rows.length / 2)));
  const rowH = Math.min(12, 228 / P);
  const pages = Math.max(1, Math.ceil(rows.length / (P * 2)));
  const half = '<col style="width:5%"><col style="width:13%"><col style="width:12%"><col style="width:20%">';
  const hd = cls => `<th class="no${cls}">연번</th><th>직위/담당</th><th>성명</th><th>서명</th>`;
  const cell = (idx, cls) => {
    const r = rows[idx];
    if(!r) return `<td class="no${cls}"></td><td></td><td></td><td class="sg"></td>`;
    return `<td class="no${cls}">${idx + 1}</td><td>${esc(r.role)}</td><td>${esc(nameOf(r))}</td><td class="sg">${signImg(r, rowH - 1)}</td>`;
  };
  const when = [fmtDate(t.due), t.time].filter(Boolean).join(' ');
  let out = '';
  for(let p = 0; p < pages; p++){
    const base = p * P * 2; let body = '';
    for(let i = 0; i < P; i++) body += `<tr style="height:${rowH}mm">${cell(base + i, '')}${cell(base + P + i, ' split')}</tr>`;
    out += `<section class="sheet offline">
      <h2>${esc(t.title)}</h2>
      <p class="sub"><span>${[when ? '일시: ' + esc(when) : '', t.place ? '장소: ' + esc(t.place) : ''].filter(Boolean).join('　')}</span><span>${esc(school)}</span></p>
      <table class="fixed"><colgroup>${half}${half}</colgroup><thead><tr>${hd('')}${hd(' split')}</tr></thead><tbody>${body}</tbody></table>
      ${pages > 1 ? `<p class="pg">${p + 1} / ${pages}</p>` : ''}
    </section>`;
  }
  mount.innerHTML = out;
}

/* ───────── 관리자 설정 (비밀번호로 잠금): AI 키 ───────── */
async function pwHash(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('yeonsu-register:' + text));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function parseBulk(text, group){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    let role = '', name = '';
    if(/[\t]/.test(line)){ const p = line.split('\t').map(s => s.trim()); role = p[0] || ''; name = p[1] || ''; }
    else{ const p = line.split(/\s+/); if(p.length === 1) role = p[0]; else { name = p.pop(); role = p.join(' '); } }
    return { id: rid(), group, role, name };
  }).filter(m => m.role || m.name);
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);

/* 엑셀 표(2차원 배열)를 [{groupName, role, name}]로 바꾼다 */
function parseSheet(aoa){
  const clean = v => String(v ?? '').replace(/\s+/g, ' ').trim();
  let rows = aoa.map(r => r.map(clean)).filter(r => r.some(Boolean));
  if(!rows.length) return [];
  let cg = -1, cr = -1, cn = -1;
  const hi = rows.slice(0, 10).findIndex(r => r.some(c => /성명|이름/.test(c)));
  if(hi >= 0){
    rows[hi].forEach((c, i) => {
      if(cn < 0 && /성명|이름/.test(c)) cn = i;
      else if(cr < 0 && /직위|담당|직급|학년|반/.test(c)) cr = i;
      else if(cg < 0 && /구분|분류|소속/.test(c)) cg = i;
    });
    rows = rows.slice(hi + 1);
  }else{
    const width = Math.max(...rows.map(r => r.length));
    if(width >= 3){ cg = 0; cr = 1; cn = 2; } else { cr = 0; cn = 1; }
  }
  let lastGroup = '';
  return rows.map(r => {
    const g = cg >= 0 ? (r[cg] || '') : '';
    if(g) lastGroup = g;
    return { groupName: g || lastGroup, role: cr >= 0 ? (r[cr] || '') : '', name: cn >= 0 ? (r[cn] || '') : '' };
  }).filter(x => x.role || x.name);
}
async function onXlsxFile(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  try{
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['명부'] || wb.Sheets[wb.SheetNames[0]];
    const list = parseSheet(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false }));
    if(!list.length) return alert('파일에서 명부를 찾지 못했습니다.\n첫 줄에 구분, 직위/담당, 성명이 있는 서식인지 확인해 주세요.');
    const names = [...new Set(list.map(x => x.groupName).filter(Boolean))];
    $('#import-msg').textContent = `「${file.name}」에서 ${list.length}명을 읽었습니다.` + (names.length ? ` (구분: ${names.join(', ')})` : '');
    $('#import-add').onclick = () => applyImport(list, false);
    $('#import-replace').onclick = () => applyImport(list, true);
    $('#dlg-import').showModal();
  }catch(err){ console.error(err); alert('엑셀 파일을 읽지 못했습니다.\n' + (err.message || '')); }
}
function applyImport(list, replace){
  const r = S.roster;
  if(replace){
    if(r.members.length && !confirm(`지금 명부 ${r.members.length}명을 지우고 파일의 ${list.length}명으로 바꿉니다.\n계속할까요?`)) return;
    r.members = [];
  }
  list.forEach(x => {
    let g = x.groupName ? r.groups.find(g => norm(g.name) === norm(x.groupName)) : r.groups[0];
    if(!g){ g = { id: 'g' + rid(), name: x.groupName }; r.groups.push(g); }
    r.members.push({ id: rid(), group: g.id, role: x.role, name: x.name });
  });
  sortMembers(); paintRoster(); scheduleSave(saveRoster);
  $('#dlg-import').close(); toast(`${list.length}명을 불러왔습니다`);
}
/* 엑셀에서 복사한 여러 칸을 명부 표에 바로 붙여넣기 */
$app.addEventListener('paste', e => {
  const t = e.target;
  if(!S.roster || t.tagName !== 'INPUT' || !t.dataset.mf) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!/[\t\n]/.test(text.replace(/[\r\n]+$/, ''))) return;      // 한 칸짜리는 평소처럼 붙여넣기
  e.preventDefault();
  const grid = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t').map(c => c.trim()));
  const r = S.roster;
  const start = r.members.findIndex(m => m.id === t.closest('tr').dataset.m);
  const cols = t.dataset.mf === 'role' ? ['role', 'name'] : ['name'];
  const group = r.members[start].group;
  let added = 0;
  grid.forEach((cells, i) => {
    let m = r.members[start + i];
    if(!m || m.group !== group){ m = { id: rid(), group, role: '', name: '' }; r.members.splice(start + i, 0, m); added++; }
    cols.forEach((f, c) => { if(cells[c] !== undefined) m[f] = cells[c]; });
  });
  sortMembers(); paintRoster(); scheduleSave(saveRoster);
  toast(`${grid.length}줄을 붙여넣었습니다` + (added ? ` (${added}줄 추가)` : ''));
});

    }
    if(act === 'delall'){
      if(!r.members.length) return;
      if(!confirm(`명부 ${r.members.length}명을 모두 삭제할까요?\n구분은 그대로 남고, 이미 등록한 연수의 명단은 바뀌지 않습니다.`)) return;
      r.members = []; S.sel.clear();
      paintRoster(); scheduleSave(saveRoster); toast('명부를 모두 삭제했습니다'); return;
    }
    if(act === 'xlsx-down') return await downloadTemplate();
    if(act === 'xlsx-up') return $('#xlsx-file').click();
    if(act === 'bulk'){
      $('#bulk-group').innerHTML = r.groups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
      $('#bulk-text').value = ''; return $('#dlg-bulk').showModal();
    }
    const mtr = b.closest('tr[data-m]'); if(!mtr) return;
    const i = r.members.findIndex(m => m.id === mtr.dataset.m); if(i < 0) return;
    if(act === 'mup' || act === 'mdown'){
      const j = act === 'mup' ? i - 1 : i + 1;
      if(j < 0 || j >= r.members.length || r.members[j].group !== r.members[i].group) return;
      [r.members[i], r.members[j]] = [r.members[j], r.members[i]];
      paintRoster(); scheduleSave(saveRoster); return;
    }
    if(act === 'mdel'){
      const m = r.members[i];
      if(!confirm(`${[m.role, m.name].filter(Boolean).join(' ') || '이 줄'}을(를) 명부에서 삭제할까요?`)) return;
      r.members.splice(i, 1); paintRoster(); scheduleSave(saveRoster); return;
    }
  }catch(err){ fail(err); }
});

document.addEventListener('click', e => { const c = e.target.closest('dialog [data-close]'); if(c) c.closest('dialog').close(); });
$('#bulk-ok').addEventListener('click', () => {
  const add = parseBulk($('#bulk-text').value, $('#bulk-group').value);
  if(!add.length) return alert('붙여넣은 내용이 없습니다.');
  S.roster.members.push(...add); sortMembers(); paintRoster(); scheduleSave(saveRoster);
  $('#dlg-bulk').close(); toast(`${add.length}명을 추가했습니다`);
});
window.addEventListener('beforeprint', renderSheets);

/* 시작 */
(async () => {
  try{ const cred = await signInAnonymously(auth); uid = cred.user.uid; await route(); }
  catch(e){
    console.error(e);
    $app.innerHTML = `<div class="card"><h2>연결하지 못했습니다</h2><p class="muted">${esc(errText(e))}</p></div>`;
  }
})();
</script>
