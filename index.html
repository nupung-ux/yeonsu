<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연수등록부 서명</title>
<style>
  :root{
    --ink:#1c2733; --sub:#5d6978; --line:#d7dde6; --bg:#f3f5f8; --card:#ffffff;
    --accent:#1d5fbf; --accent-dark:#174c99; --ok:#17794d; --warn:#b3261e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:540px;margin:0 auto;padding:20px 16px 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
  .eyebrow{margin:0 0 2px;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
  h1{margin:0;font-size:1.3rem;line-height:1.35;text-wrap:balance}
  .meta{margin:4px 0 0;color:var(--sub);font-size:.92rem}
  hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  label{display:block;font-weight:700;margin-bottom:8px}
  input[type=text]{width:100%;font:inherit;font-size:1.15rem;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:inherit}
  input[type=text]:focus{outline:3px solid #c9dcf7;border-color:var(--accent)}
  button{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:12px 16px;cursor:pointer}
  button:focus-visible{outline:3px solid #c9dcf7}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:active{background:var(--accent-dark)}
  button:disabled{opacity:.55;cursor:default}
  .full{width:100%;margin-top:12px;font-size:1.05rem;padding:14px}
  .err{color:var(--warn);font-weight:700;margin:10px 0 0}
  .note{background:#fff7e0;border:1px solid #ecd58b;border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 12px}
  .choices{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .choices button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .choices .role{color:var(--sub);font-weight:500}
  .who{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .who b{font-size:1.25rem}
  .who span{color:var(--sub)}
  .padwrap{position:relative;border:2px dashed #9fb0c6;border-radius:14px;background:#fff;overflow:hidden}
  canvas{display:block;width:100%;aspect-ratio:2/1;touch-action:none;cursor:crosshair}
  .hint{position:absolute;inset:0;display:grid;place-items:center;color:#a6b1c0;pointer-events:none;font-size:1.05rem}
  [hidden]{display:none!important}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns .primary{flex:1}
  .done{text-align:center}
  .done .check{width:56px;height:56px;border-radius:50%;background:#e2f4ea;color:var(--ok);display:grid;place-items:center;margin:4px auto 10px;font-size:1.8rem;font-weight:700}
  .done img{max-width:70%;max-height:110px;margin:10px auto 0;display:block}
  .loading{color:var(--sub);text-align:center;padding:30px 0}
  footer{text-align:center;color:#9aa5b3;font-size:.78rem;padding:0 0 24px}
</style>
</head>
<body>
<main><div class="card" id="app"><p class="loading">불러오는 중입니다…</p></div></main>
<footer>made by 너펑이</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAB1pvTKdz4I2e2jVDWfsD93tNroSDS6t8",
  authDomain: "yeonsu-register.firebaseapp.com",
  projectId: "yeonsu-register",
  storageBucket: "yeonsu-register.firebasestorage.app",
  messagingSenderId: "512584387404",
  appId: "1:512584387404:web:6b021a133750417a661de9"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const $app = document.getElementById('app');
const regId = new URLSearchParams(location.search).get('id');
let reg = null;
let uid = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();

function fmtDate(v){
  if(!v) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!m) return v;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return `${+m[1]}. ${+m[2]}. ${+m[3]}.(${'일월화수목금토'[d.getDay()]})`;
}

function errText(e){
  const code = e && e.code || '';
  if(code.includes('admin-restricted-operation') || code.includes('operation-not-allowed') || code.includes('configuration-not-found'))
    return '파이어베이스 Authentication에서 익명 로그인이 켜져 있지 않습니다. 담당자에게 알려 주세요.';
  if(code.includes('permission-denied'))
    return '서명이 마감되었거나 저장 권한이 없습니다. 담당자에게 알려 주세요.';
  if(code.includes('unavailable') || code.includes('network'))
    return '인터넷 연결을 확인한 뒤 다시 시도해 주세요.';
  return '잠시 후 다시 시도해 주세요. (' + (code || (e && e.message) || '알 수 없는 오류') + ')';
}

function header(){
  const meta = [fmtDate(reg.date), reg.time, reg.place].filter(Boolean).join('  |  ');
  return `<p class="eyebrow">연수등록부</p><h1>${esc(reg.title)}</h1>${meta ? `<p class="meta">${esc(meta)}</p>` : ''}<hr>`;
}

function message(title, body){
  $app.innerHTML = `<p class="eyebrow">연수등록부</p><h1>${esc(title)}</h1><p class="meta">${esc(body)}</p>`;
}

/* 1. 이름 입력 */
function showName(errMsg){
  $app.innerHTML = header() + `
    <form id="f">
      <label for="nm">이름을 입력해 주세요</label>
      <input type="text" id="nm" autocomplete="off" enterkeyhint="go" placeholder="예: 홍길동">
      ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}
      <button class="primary full" type="submit">서명하러 가기</button>
    </form>`;
  const $nm = document.getElementById('nm');
  $nm.focus();
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const q = norm($nm.value);
    if(!q) return showName('이름을 입력해 주세요.');
    const rows = reg.rows || [];
    const exact = rows.filter(r => norm(r.name) === q);
    if(exact.length === 1) return showPad(exact[0]);
    if(exact.length > 1) return showChoices(exact, '같은 이름이 여러 명 있습니다. 본인을 골라 주세요.');
    const near = q.length >= 2 ? rows.filter(r => norm(r.name).includes(q)) : [];
    if(near.length) return showChoices(near, '입력한 이름과 비슷한 분입니다. 본인을 골라 주세요.');
    showName('명단에 없는 이름입니다. 이름을 다시 확인하거나 담당자에게 알려 주세요.');
  });
}

/* 2. 동명이인 선택 */
function showChoices(list, guide){
  $app.innerHTML = header() + `
    <label>${esc(guide)}</label>
    <ul class="choices">
      ${list.map(r => `<li><button type="button" data-id="${esc(r.id)}"><span>${esc(r.name)}</span><span class="role">${esc(r.role || '')}</span></button></li>`).join('')}
    </ul>
    <button class="full" type="button" id="back">이름 다시 입력</button>`;
  $app.querySelectorAll('.choices button').forEach(b => b.addEventListener('click', () => {
    showPad(list.find(r => r.id === b.dataset.id));
  }));
  document.getElementById('back').addEventListener('click', () => showName());
}

/* 3. 서명 */
async function showPad(row){
  let already = false;
  try{
    const s = await getDoc(doc(db, 'registers', regId, 'signs', row.id));
    already = s.exists();
  }catch(e){ /* 확인 실패는 무시하고 서명 진행 */ }

  $app.innerHTML = header() + `
    <div class="who"><b>${esc(row.name)}</b><span>${esc(row.role || '')}</span></div>
    ${already ? '<p class="note">이미 서명이 등록되어 있습니다. 다시 제출하면 새 서명으로 바뀝니다.</p>' : ''}
    <div class="padwrap"><canvas id="pad"></canvas><span class="hint" id="hint">이 칸 안에 서명해 주세요</span></div>
    <p class="err" id="err" hidden></p>
    <div class="btns">
      <button type="button" id="back">이름 변경</button>
      <button type="button" id="clear">지우기</button>
      <button type="button" class="primary" id="save">서명 제출</button>
    </div>`;

  const pad = setupPad(document.getElementById('pad'), document.getElementById('hint'));
  const $err = document.getElementById('err');
  const $save = document.getElementById('save');
  document.getElementById('back').addEventListener('click', () => showName());
  document.getElementById('clear').addEventListener('click', () => pad.clear());
  $save.addEventListener('click', async () => {
    if(!pad.hasInk()){ $err.textContent = '서명을 먼저 해 주세요.'; $err.hidden = false; return; }
    $save.disabled = true; $save.textContent = '저장 중…'; $err.hidden = true;
    try{
      const dataUrl = pad.toDataURL();
      await setDoc(doc(db, 'registers', regId, 'signs', row.id), {
        dataUrl, name: row.name || '', role: row.role || '', uid, signedAt: serverTimestamp()
      });
      showDone(row, dataUrl);
    }catch(e){
      console.error(e);
      $err.textContent = '저장하지 못했습니다. ' + errText(e); $err.hidden = false;
      $save.disabled = false; $save.textContent = '서명 제출';
    }
  });
}

function setupPad(canvas, hint){
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  const style = () => { ctx.lineWidth = 2.8 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; };
  style();
  let drawing = false, last = null, ink = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    drawing = true; last = pos(e); ink = true; hint.hidden = true;
    ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  return {
    hasInk: () => ink,
    clear(){ ctx.clearRect(0, 0, canvas.width, canvas.height); ink = false; hint.hidden = false; },
    /* 여백을 잘라 내고 작은 PNG로 만든다 (투명 배경) */
    toDataURL(){
      const w = canvas.width, h = canvas.height;
      const d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(let y = 0; y < h; y++){
        for(let x = 0; x < w; x++){
          if(d[(y * w + x) * 4 + 3] > 12){
            if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
          }
        }
      }
      if(x1 < 0) return canvas.toDataURL('image/png');
      const m = Math.round(6 * dpr);
      x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
      const s = Math.min(480 / bw, 200 / bh, 2.5);
      const out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(bw * s)); out.height = Math.max(1, Math.round(bh * s));
      const o = out.getContext('2d');
      o.imageSmoothingQuality = 'high';
      o.drawImage(canvas, x0, y0, bw, bh, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }
  };
}

/* 4. 완료 */
function showDone(row, dataUrl){
  $app.innerHTML = header() + `
    <div class="done">
      <div class="check" aria-hidden="true">✓</div>
      <h1>서명이 등록되었습니다</h1>
      <p class="meta">${esc(row.name)} ${esc(row.role || '')}</p>
      <img src="${esc(dataUrl)}" alt="등록된 서명">
    </div>
    <button class="full" type="button" id="next">다른 사람 서명하기</button>`;
  document.getElementById('next').addEventListener('click', () => showName());
}

async function start(){
  if(!regId) return message('서명 링크가 올바르지 않습니다', '담당자에게 받은 링크나 QR 코드로 다시 접속해 주세요.');
  try{
    const cred = await signInAnonymously(auth);
    uid = cred.user.uid;
    const snap = await getDoc(doc(db, 'registers', regId));
    if(!snap.exists()) return message('등록부를 찾을 수 없습니다', '삭제되었거나 링크가 잘못되었습니다. 담당자에게 알려 주세요.');
    reg = snap.data();
    document.title = (reg.title || '연수등록부') + ' 서명';
    if(reg.archived || reg.closed) return message('서명이 마감된 등록부입니다', '「' + (reg.title || '') + '」 서명이 마감되었습니다. 담당자에게 알려 주세요.');
    showName();
  }catch(e){
    console.error(e);
    message('연결하지 못했습니다', errText(e));
  }
}
start();
</script>
</body>
</html>
